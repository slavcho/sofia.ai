<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sofia.ai — Metro, parks and areas</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root {
    --bg: #ffffff; --panel: #f7f7f8; --text: #1d1f23; --muted: #6b7079;
    --border: #e3e4e8; --accent: #1e6fb8;
    --ok: #2ba84a; --warn: #e89a00; --bad: #d93a3a; --unknown: #9aa0a8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17191d; --panel: #1f2227; --text: #e8e9ec; --muted: #9aa0a8;
            --border: #30343b; --accent: #5aa2e8; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
               font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; }
  #side { width: 340px; flex: none; height: 100%; overflow-y: auto;
          background: var(--panel); border-right: 1px solid var(--border); padding: 16px; }
  #map { flex: 1; height: 100%; }
  h1 { font-size: 18px; margin: 0 0 2px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em;
       color: var(--muted); margin: 20px 0 8px; }
  .sub { color: var(--muted); font-size: 12px; }
  label.toggle { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
  .line { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  .chip { display: inline-block; min-width: 28px; padding: 1px 6px; border-radius: 4px;
          color: #fff; font-weight: 600; font-size: 12px; text-align: center; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  #info { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  #info h3 { margin: 0 0 6px; font-size: 16px; }
  #info dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 8px 0 0; font-size: 12px; }
  #info dt { color: var(--muted); }
  #info dd { margin: 0; overflow-wrap: anywhere; }
  #info ul { margin: 6px 0 0; padding-left: 0; list-style: none; font-size: 12px; }
  #info li { display: flex; gap: 6px; align-items: baseline; padding: 1px 0; }
  .status { font-size: 11px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--border); }
  .issue { padding: 6px 8px; margin: 0 -8px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .issue:hover { background: var(--bg); }
  .issue b { font-weight: 600; }
  details summary { cursor: pointer; font-size: 13px; padding: 3px 0; }
  .empty { color: var(--muted); font-size: 12px; }
  select { width: 100%; margin: 3px 0; padding: 4px; font: inherit; color: var(--text);
           background: var(--bg); border: 1px solid var(--border); border-radius: 6px; }
  .swatch { display: inline-block; width: 14px; height: 10px; border-radius: 2px; flex: none; }
  table.access { border-collapse: collapse; margin: 8px 0 2px; font-size: 12px; width: 100%; }
  table.access th { color: var(--muted); font-weight: 500; text-align: right; padding: 1px 4px; }
  table.access td { text-align: right; padding: 1px 4px; }
  table.access th:first-child, table.access td:first-child { text-align: left; padding-left: 0; }
  #info h4 { margin: 12px 0 0; font-size: 12px; color: var(--muted); font-weight: 600; }
  @media (max-width: 720px) {
    body { flex-direction: column-reverse; }
    #side { width: 100%; height: 45%; border-right: 0; border-top: 1px solid var(--border); }
    #map { height: 55%; }
  }
</style>
</head>
<body>
<aside id="side">
  <h1>Sofia metro and parks</h1>
  <div class="sub">Stations 2021 · entrances 2020 (OSM) · parks 2020 · residents 2019 · urbandata.sofia.bg</div>

  <h2>Layers</h2>
  <label class="toggle"><input type="checkbox" data-layers="stations,station-labels" checked> Stations</label>
  <label class="toggle"><input type="checkbox" data-layers="outlines-fill,outlines-line" checked> Station outlines</label>
  <label class="toggle"><input type="checkbox" data-layers="entrances" checked> Entrances</label>
  <label class="toggle"><input type="checkbox" data-layers="tracks-existing,tracks-planned" checked> Track</label>
  <label class="toggle"><input type="checkbox" id="show-planned" checked> Planned stations</label>
  <label class="toggle"><input type="checkbox" data-layers="parks-fill,parks-line" checked> Parks</label>
  <label class="toggle"><input type="checkbox" data-layers="park-entrances" checked> Park entrances</label>
  <label class="toggle"><input type="checkbox" id="show-planned-parks"> Planned parks</label>

  <h2>Areas</h2>
  <select id="area-kind">
    <option value="">No areas</option>
    <option value="district">Districts (райони)</option>
    <option value="neighbourhood">Neighbourhoods (квартали)</option>
    <option value="planning_unit">Planning units</option>
  </select>
  <select id="area-metric"></select>
  <div id="area-legend" class="legend"></div>

  <h2>Lines</h2>
  <div id="lines"></div>

  <h2>Entrances: wheelchair access</h2>
  <div class="legend">
    <span><i class="dot" style="background:var(--ok)"></i>yes</span>
    <span><i class="dot" style="background:var(--warn)"></i>limited</span>
    <span><i class="dot" style="background:var(--bad)"></i>no</span>
    <span><i class="dot" style="background:var(--unknown)"></i>not tagged</span>
  </div>

  <h2>Parks</h2>
  <div id="park-legend" class="legend"></div>

  <h2>Selected</h2>
  <div id="info"><div class="empty">Click a station, a park, an entrance or an area on the map.</div></div>

  <h2>Data issues</h2>
  <div id="issues"></div>
</aside>
<div id="map"></div>

<script>
const COLORS = { yes: '#2ba84a', limited: '#e89a00', no: '#d93a3a', unknown: '#9aa0a8' };
const PLANNED = '#8a8f98';
const PARK_COLORS = { city_park: '#2e8b57', local_garden: '#74c476', special_green: '#a6a14a', unclassified: '#9ccc9c' };
const PARK_KIND = { city_park: 'city park (Зп)', local_garden: 'local garden (Тго)',
                    special_green: 'special green area (Тзсп)', unclassified: 'not classified (2019)' };
const GATE_COLORS = { main: '#00441b', secondary: '#41ab5d', unofficial: '#e6550d', unknown: '#9aa0a8' };
const NOTHING = ['boolean', false];   // a filter that hides every feature
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// MapLibre hands array properties back as JSON strings.
const arr = v => Array.isArray(v) ? v : (typeof v === 'string' && v.startsWith('[') ? JSON.parse(v) : []);
const getJSON = url => fetch(url).then(r => { if (!r.ok) throw new Error(url + ': ' + r.status); return r.json(); });

const map = new maplibregl.Map({
  container: 'map',
  center: [23.32, 42.69], zoom: 11.5,
  style: {
    version: 8,
    glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
    sources: { osm: { type: 'raster', tileSize: 256,
      tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors · data: <a href="https://urbandata.sofia.bg/">urbandata.sofia.bg</a>' } },
    layers: [{ id: 'osm', type: 'raster', source: 'osm',
               paint: { 'raster-saturation': -0.6, 'raster-opacity': 0.85 } }]
  }
});
map.addControl(new maplibregl.NavigationControl(), 'top-right');
map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }));

// What the areas can be coloured by. Shares are of the area's residents;
// distances are straight lines to a station outline (an upper bound on reach).
const ACCESS = ['#ffffcc', '#a1dab4', '#41b6c4', '#2c7fb8', '#253494'];
const PCT = [0.2, 0.4, 0.6, 0.8];
const GREEN = ['#ffffcc', '#c2e699', '#78c679', '#31a354', '#006837'];
const METRICS = {
  share_500:          { label: 'Residents within 500 m of a station', breaks: PCT, colors: ACCESS, pct: true },
  share_1000:         { label: 'Residents within 1 km of a station', breaks: PCT, colors: ACCESS, pct: true },
  planned_share_500:  { label: 'Within 500 m, with planned stations', breaks: PCT, colors: ACCESS, pct: true },
  planned_share_1000: { label: 'Within 1 km, with planned stations', breaks: PCT, colors: ACCESS, pct: true },
  gain_500:           { label: 'Gain from planned stations (500 m)', breaks: [0.05, 0.15, 0.3, 0.5],
                        colors: ['#f2f0f7', '#cbc9e2', '#9e9ac8', '#756bb1', '#54278f'], pct: true },
  park_share_300:     { label: 'Parks: residents within 300 m of an entrance', breaks: PCT, colors: GREEN, pct: true },
  park_share_800:     { label: 'Parks: residents within 800 m of an entrance', breaks: PCT, colors: GREEN, pct: true },
  city_park_share_800: { label: 'Parks: within 800 m of a city park', breaks: PCT, colors: GREEN, pct: true },
  sofiaplan_park_share: { label: 'Parks: Sofiaplan, with walking access (2021)', breaks: PCT, colors: GREEN, pct: true },
  density:            { label: 'Residents per km²', breaks: [1000, 3000, 6000, 10000],
                        colors: ['#feedde', '#fdbe85', '#fd8d3c', '#e6550d', '#a63603'] },
};
// Below this a share says more about one building than about the area.
const MIN_PEOPLE = 100;
const NO_DATA = '#c4c7cc';
const KIND_LABEL = { district: 'District', neighbourhood: 'Neighbourhood', planning_unit: 'Planning unit' };
const AREA_FILE = { district: 'regions_sofia.geojson (GIS Sofia)',
                    neighbourhood: 'kvartali_26_sofpr_20190101 (Sofiaplan)',
                    planning_unit: 'ge_26_sofpr_20200616 (Sofiaplan)' };

let lines = {}, stations = null, entrances = null, parks = null, gates = null;
let areaKind = '', areaCache = {}, selection = null;
const pct = v => v == null ? '—' : Math.round(v * 100) + '%';
const num = v => v == null ? '—' : Number(v).toLocaleString();

map.on('load', async () => {
  const [lineList, st, outlines, en, tracks, issues, areaIssues, pk, pe, parkIssues] = await Promise.all([
    getJSON('/api/metro/lines'), getJSON('/api/metro/stations'),
    getJSON('/api/metro/stations?shape=outline'), getJSON('/api/metro/entrances'),
    getJSON('/api/metro/tracks'), getJSON('/api/metro/issues'), getJSON('/api/areas/issues'),
    getJSON('/api/parks'), getJSON('/api/parks/entrances'), getJSON('/api/parks/issues')]);
  lineList.forEach(l => lines[l.code] = l);
  stations = st; entrances = en; parks = pk; gates = pe;

  map.addSource('tracks', { type: 'geojson', data: tracks });
  map.addSource('outlines', { type: 'geojson', data: outlines });
  map.addSource('stations', { type: 'geojson', data: st });
  map.addSource('entrances', { type: 'geojson', data: en });
  map.addSource('selected', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addSource('areas', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addSource('parks', { type: 'geojson', data: pk, promoteId: 'id' });
  map.addSource('park-entrances', { type: 'geojson', data: pe });

  // Areas go under everything else, so stations stay clickable on top.
  map.addLayer({ id: 'areas-fill', type: 'fill', source: 'areas',
    paint: { 'fill-color': NO_DATA, 'fill-opacity': 0.55 } });
  map.addLayer({ id: 'areas-line', type: 'line', source: 'areas',
    paint: { 'line-color': '#4a4f57', 'line-width': ['interpolate', ['linear'], ['zoom'], 10, 0.4, 15, 1.2] } });
  map.addLayer({ id: 'areas-selected', type: 'line', source: 'areas', filter: NOTHING,
    paint: { 'line-color': '#d6007a', 'line-width': 3 } });

  // Parks over the areas, under the metro. Planned parks are hidden at
  // first: they are master plan zones, much of it forest and fields.
  const parkColor = ['match', ['get', 'kind'], ...Object.entries(PARK_COLORS).flat(), PARK_COLORS.unclassified];
  map.addLayer({ id: 'parks-fill', type: 'fill', source: 'parks', filter: ['==', ['get', 'status'], 'existing'],
    paint: { 'fill-color': parkColor,
             'fill-opacity': ['case', ['==', ['get', 'status'], 'planned'], 0.15, 0.45] } });
  map.addLayer({ id: 'parks-line', type: 'line', source: 'parks', filter: ['==', ['get', 'status'], 'existing'],
    paint: { 'line-color': parkColor, 'line-width': 1,
             'line-opacity': ['case', ['==', ['get', 'status'], 'planned'], 0.4, 0.9] } });
  map.addLayer({ id: 'parks-selected', type: 'line', source: 'parks', filter: NOTHING,
    paint: { 'line-color': '#ffcc00', 'line-width': 3 } });

  map.addLayer({ id: 'tracks-existing', type: 'line', source: 'tracks',
    filter: ['==', ['get', 'status'], 'existing'],
    paint: { 'line-color': '#3b3f46', 'line-width': ['interpolate', ['linear'], ['zoom'], 11, 2, 16, 5] } });
  map.addLayer({ id: 'tracks-planned', type: 'line', source: 'tracks',
    filter: ['==', ['get', 'status'], 'planned'],
    paint: { 'line-color': PLANNED, 'line-dasharray': [2, 2],
             'line-width': ['interpolate', ['linear'], ['zoom'], 11, 1.5, 16, 4] } });
  map.addLayer({ id: 'outlines-fill', type: 'fill', source: 'outlines', minzoom: 14,
    paint: { 'fill-color': ['get', 'color'], 'fill-opacity': 0.25 } });
  map.addLayer({ id: 'outlines-line', type: 'line', source: 'outlines', minzoom: 14,
    paint: { 'line-color': ['get', 'color'], 'line-width': 1.5,
             // line-dasharray cannot depend on the data, so planned stations are fainter instead.
             'line-opacity': ['case', ['==', ['get', 'status'], 'planned'], 0.5, 1] } });
  map.addLayer({ id: 'selected', type: 'circle', source: 'selected',
    paint: { 'circle-radius': 14, 'circle-color': 'rgba(0,0,0,0)',
             'circle-stroke-color': '#ffcc00', 'circle-stroke-width': 3 } });
  map.addLayer({ id: 'park-entrances', type: 'circle', source: 'park-entrances', minzoom: 14,
    paint: { 'circle-radius': ['interpolate', ['linear'], ['zoom'], 14, 2.5, 17, 5],
             'circle-color': ['match', ['get', 'kind'], ...Object.entries(GATE_COLORS).flat(), GATE_COLORS.unknown],
             'circle-stroke-color': '#fff', 'circle-stroke-width': 1 } });
  map.addLayer({ id: 'entrances', type: 'circle', source: 'entrances', minzoom: 13,
    paint: { 'circle-radius': ['interpolate', ['linear'], ['zoom'], 13, 2.5, 17, 6],
             'circle-color': ['match', ['get', 'wheelchair'],
                              'yes', COLORS.yes, 'limited', COLORS.limited, 'no', COLORS.no, COLORS.unknown],
             'circle-stroke-color': '#fff', 'circle-stroke-width': 1 } });
  map.addLayer({ id: 'stations', type: 'circle', source: 'stations',
    paint: { 'circle-radius': ['interpolate', ['linear'], ['zoom'], 10, 4, 15, 9],
             'circle-color': ['case', ['==', ['get', 'status'], 'planned'], '#ffffff', ['get', 'color']],
             'circle-stroke-color': ['case', ['==', ['get', 'status'], 'planned'], PLANNED, '#ffffff'],
             'circle-stroke-width': 2 } });
  map.addLayer({ id: 'station-labels', type: 'symbol', source: 'stations', minzoom: 12.5,
    layout: { 'text-field': ['coalesce', ['get', 'name'], ''], 'text-size': 12,
              'text-font': ['Noto Sans Regular'],
              'text-offset': [0, 1.1], 'text-anchor': 'top', 'text-optional': true },
    paint: { 'text-color': '#1d1f23', 'text-halo-color': '#fff', 'text-halo-width': 1.5 } });

  // Area labels go last, above the stations, but only once zoomed in.
  map.addLayer({ id: 'areas-labels', type: 'symbol', source: 'areas', minzoom: 13,
    layout: { 'text-field': ['coalesce', ['get', 'name'], ''], 'text-size': 11,
              'text-font': ['Noto Sans Regular'], 'text-optional': true },
    paint: { 'text-color': '#3b3f46', 'text-halo-color': '#fff', 'text-halo-width': 1.2 } });

  renderLines();
  renderParkLegend();
  renderIssues(issues, areaIssues, parkIssues);
  bindToggles();
  bindAreaControls();

  for (const id of ['stations', 'outlines-fill']) {
    map.on('click', id, e => selectStation(e.features[0].properties.id));
    map.on('mouseenter', id, () => map.getCanvas().style.cursor = 'pointer');
    map.on('mouseleave', id, () => map.getCanvas().style.cursor = '');
  }
  map.on('click', 'entrances', e => {
    if (map.queryRenderedFeatures(e.point, { layers: ['stations'] }).length) return;
    selectEntrance(e.features[0].properties.id);
  });
  map.on('mouseenter', 'entrances', () => map.getCanvas().style.cursor = 'pointer');
  map.on('mouseleave', 'entrances', () => map.getCanvas().style.cursor = '');
  // Metro first, then park entrances, parks, and areas last.
  const METRO = ['stations', 'entrances', 'outlines-fill'];
  map.on('click', 'park-entrances', e => {
    if (map.queryRenderedFeatures(e.point, { layers: METRO }).length) return;
    selectParkEntrance(e.features[0].properties.id);
  });
  map.on('click', 'parks-fill', e => {
    if (map.queryRenderedFeatures(e.point, { layers: [...METRO, 'park-entrances'] }).length) return;
    selectPark(e.features[0].properties.id);
  });
  for (const id of ['park-entrances', 'parks-fill']) {
    map.on('mouseenter', id, () => map.getCanvas().style.cursor = 'pointer');
    map.on('mouseleave', id, () => map.getCanvas().style.cursor = '');
  }
  map.on('click', 'areas-fill', e => {
    if (map.queryRenderedFeatures(e.point, { layers: [...METRO, 'park-entrances', 'parks-fill'] }).length) return;
    selectArea(areaKind, e.features[0].properties.id);
  });

  // ?station=<id>, ?entrance=<id>, ?park=<id>, ?park_entrance=<id> or
  // ?area=<kind>:<id> opens the page on that object, so it can be shared.
  const q = new URLSearchParams(location.search);
  if (q.has('station')) selectStation(+q.get('station'), false);
  else if (q.has('entrance')) selectEntrance(+q.get('entrance'), false);
  else if (q.has('park')) selectPark(q.get('park'), false);
  else if (q.has('park_entrance')) selectParkEntrance(+q.get('park_entrance'), false);
  else if (q.has('area')) { const [k, id] = q.get('area').split(':'); selectArea(k, id, false); }
});

function remember(kind, id) {
  history.replaceState(null, '', `?${kind}=${id}`);
}

function chip(code) {
  const l = lines[code];
  return `<span class="chip" style="background:${l ? l.color : PLANNED}">${esc(code)}</span>`;
}

function renderLines() {
  document.getElementById('lines').innerHTML = Object.values(lines).map(l =>
    `<div class="line">${chip(l.code)} <span>${esc(l.name)}<br>
     <span class="sub">${l.stations} stations · since ${esc(l.opened.slice(0, 4))}</span></span></div>`).join('') +
    `<div class="line"><i class="dot" style="background:#fff;border:2px solid ${PLANNED}"></i>
     <span class="sub">planned (line not given in the data)</span></div>`;
}

function renderParkLegend() {
  document.getElementById('park-legend').innerHTML =
    Object.entries(PARK_KIND).map(([k, label]) =>
      `<span><i class="swatch" style="background:${PARK_COLORS[k]}"></i>${esc(label)}</span>`).join('') +
    ['main', 'secondary', 'unofficial'].map(k =>
      `<span><i class="dot" style="background:${GATE_COLORS[k]}"></i>${k} entrance</span>`).join('');
}

function renderIssues(issues, areaIssues, parkIssues) {
  const groups = {};
  issues.concat(areaIssues, parkIssues).forEach(i => (groups[i.issue] ||= []).push(i));
  const box = document.getElementById('issues');
  if (!issues.length) { box.innerHTML = '<div class="empty">None.</div>'; return; }
  box.innerHTML = Object.entries(groups).map(([name, list]) =>
    `<details><summary>${esc(name)} (${list.length})</summary>` +
    list.map((i, n) => `<div class="issue" data-g="${esc(name)}" data-n="${n}">
       ${i.area_kind ? `<b>${esc(i.name || KIND_LABEL[i.area_kind] + ' #' + i.area_id)}</b> · ${esc(i.detail)}`
         : `<b>${esc(i.detail || (i.station_id ? 'station #' + i.station_id : 'entrance #' + i.entrance_id))}</b>`}</div>`).join('') +
    '</details>').join('');
  box.onclick = e => {
    const el = e.target.closest('.issue'); if (!el) return;
    const i = groups[el.dataset.g][+el.dataset.n];
    if (i.area_kind) selectArea(i.area_kind, i.area_id);
    else if (i.park_id) selectPark(i.park_id); else if (i.park_entrance_id) selectParkEntrance(i.park_entrance_id);
    else if (i.station_id) selectStation(i.station_id); else if (i.entrance_id) selectEntrance(i.entrance_id);
  };
}

function bindToggles() {
  document.querySelectorAll('input[data-layers]').forEach(cb => cb.onchange = () =>
    cb.dataset.layers.split(',').forEach(id =>
      map.setLayoutProperty(id, 'visibility', cb.checked ? 'visible' : 'none')));
  document.getElementById('show-planned').onchange = e => {
    const f = e.target.checked ? null : ['==', ['get', 'status'], 'existing'];
    ['stations', 'station-labels', 'outlines-fill', 'outlines-line'].forEach(id => map.setFilter(id, f));
    map.setFilter('tracks-planned', e.target.checked ? ['==', ['get', 'status'], 'planned'] : NOTHING);
  };
  document.getElementById('show-planned-parks').onchange = e => {
    const f = e.target.checked ? null : ['==', ['get', 'status'], 'existing'];
    ['parks-fill', 'parks-line'].forEach(id => map.setFilter(id, f));
  };
}

function moveTo(center, zoom, animate) {
  const view = { center, zoom: Math.max(map.getZoom(), zoom) };
  animate === false ? map.jumpTo(view) : map.flyTo(view);
}

function bindAreaControls() {
  const metric = document.getElementById('area-metric');
  metric.innerHTML = Object.entries(METRICS).map(([k, m]) => `<option value="${k}">${esc(m.label)}</option>`).join('');
  metric.disabled = true;
  metric.onchange = () => paintAreas();
  document.getElementById('area-kind').onchange = e => setAreaKind(e.target.value);
  paintAreas();
}

async function setAreaKind(kind) {
  areaKind = kind;
  document.getElementById('area-kind').value = kind;
  document.getElementById('area-metric').disabled = !kind;
  if (kind && !areaCache[kind]) areaCache[kind] = await getJSON('/api/areas/' + kind);
  if (areaKind !== kind) return;          // changed again while loading
  map.getSource('areas').setData(kind ? areaCache[kind] : { type: 'FeatureCollection', features: [] });
  map.setLayerZoomRange('areas-labels', kind === 'district' ? 10 : 13, 24);
  if (selection?.kind !== kind) map.setFilter('areas-selected', NOTHING);
  paintAreas();
}

function paintAreas() {
  const m = METRICS[document.getElementById('area-metric').value];
  const key = document.getElementById('area-metric').value;
  const steps = m.colors.flatMap((c, i) => i ? [m.breaks[i - 1], c] : [c]);
  map.setPaintProperty('areas-fill', 'fill-color',
    ['case', ['<', ['coalesce', ['get', 'population'], 0], MIN_PEOPLE], NO_DATA,
             ['step', ['coalesce', ['get', key], 0], ...steps]]);
  const fmt = v => m.pct ? Math.round(v * 100) + '%' : Number(v).toLocaleString();
  const labels = m.colors.map((_, i) =>
    i === 0 ? '< ' + fmt(m.breaks[0]) : i === m.colors.length - 1 ? '≥ ' + fmt(m.breaks[i - 1])
            : fmt(m.breaks[i - 1]) + '–' + fmt(m.breaks[i]));
  document.getElementById('area-legend').innerHTML = !areaKind ? '' :
    m.colors.map((c, i) => `<span><i class="swatch" style="background:${c}"></i>${labels[i]}</span>`).join('') +
    `<span><i class="swatch" style="background:${NO_DATA}"></i>&lt; ${MIN_PEOPLE} residents</span>`;
}

function highlight(coords) {
  map.getSource('selected').setData({ type: 'FeatureCollection',
    features: coords.map(c => ({ type: 'Feature', geometry: { type: 'Point', coordinates: c } })) });
}

function select(kind, id) {
  selection = { kind, id };
  remember(KIND_LABEL[kind] ? 'area' : kind, KIND_LABEL[kind] ? `${kind}:${id}` : id);
  if (!KIND_LABEL[kind]) map.setFilter('areas-selected', NOTHING);
  else highlight([]);
  if (kind !== 'park') map.setFilter('parks-selected', NOTHING);
}
const isSelected = (kind, id) => selection && selection.kind === kind && selection.id === id;

function selectStation(id, animate) {
  const f = stations.features.find(f => f.id === id); if (!f) return;
  const p = f.properties;
  const ens = entrances.features.filter(e => e.properties.station_id === id);
  select('station', id);
  highlight([f.geometry.coordinates]);
  moveTo(f.geometry.coordinates, 15.5, animate);
  document.getElementById('info').innerHTML = `
    <h3>${esc(p.name || 'Unnamed station')}</h3>
    <div>${arr(p.lines).map(chip).join(' ')} <span class="status">${esc(p.status)}</span>
         ${p.code ? `<span class="sub">${esc(p.code)}</span>` : ''}</div>
    <dl>
      <dt>Entrances</dt><dd>${p.entrances}${p.entrances ? `, ${p.wheelchair_entrances} wheelchair-accessible` : ' in the data'}</dd>
      <dt>Outline</dt><dd>${p.area_m2 ? Number(p.area_m2).toLocaleString() + ' m²' : '—'}</dd>
      <dt>Data as of</dt><dd>${esc(p.data_as_of)}</dd>
      <dt>Source</dt><dd>${esc(p.source)}</dd>
      <dt>Name from</dt><dd>${esc(p.name_source || '—')}</dd>
      <dt>Residents</dt><dd id="catchment" class="sub">counting…</dd>
    </dl>
    ${ens.length ? '<ul>' + ens.map(e => `<li><i class="dot" style="background:${COLORS[e.properties.wheelchair]}"></i>
        <span>${esc(e.properties.name || 'entrance #' + e.properties.id)}
        ${e.properties.access_note ? `<span class="sub">· ${esc(e.properties.access_note)}</span>` : ''}</span></li>`).join('') + '</ul>' : ''}`;
  getJSON(`/api/metro/stations/${id}/catchment`).then(c => {
    if (!isSelected('station', id)) return;
    document.getElementById('catchment').outerHTML = `<dd>${num(c.within_500)} within 500 m,
      ${num(c.within_1000)} within 1 km<br><span class="sub">nearest station for ${num(c.nearest_for)}
      ${p.status === 'planned' ? 'once built' : ''} (residents 2019, straight-line distance)</span></dd>`;
  }).catch(() => { const el = document.getElementById('catchment'); if (el) el.textContent = 'not available'; });
}

function selectEntrance(id, animate) {
  const f = entrances.features.find(f => f.id === id); if (!f) return;
  const p = f.properties;
  const st = stations.features.find(s => s.id === p.station_id);
  select('entrance', id);
  highlight([f.geometry.coordinates]);
  moveTo(f.geometry.coordinates, 16.5, animate);
  document.getElementById('info').innerHTML = `
    <h3>${esc(p.name || 'Entrance #' + p.id)}</h3>
    <div><i class="dot" style="background:${COLORS[p.wheelchair]}"></i> wheelchair: ${esc(p.wheelchair)}</div>
    <dl>
      <dt>Station</dt><dd>${st ? `<a href="#" data-station="${st.id}">${esc(st.properties.name || 'Unnamed')}</a>` : '—'}
                          <span class="sub">(source says “${esc(p.station_name)}”, ${esc(p.distance_m)} m)</span></dd>
      <dt>Access</dt><dd>${esc(p.access_note || '—')}</dd>
      <dt>Data as of</dt><dd>${esc(p.data_as_of)}</dd>
      <dt>Source</dt><dd>${esc(p.source)}</dd>
    </dl>`;
  const a = document.querySelector('#info a[data-station]');
  if (a) a.onclick = e => { e.preventDefault(); selectStation(+a.dataset.station); };
}

async function selectArea(kind, id, animate) {
  if (!KIND_LABEL[kind]) return;
  id = String(id);
  select(kind, id);
  if (areaKind !== kind) await setAreaKind(kind);
  const a = await getJSON(`/api/areas/${kind}/${id}`).catch(() => null);
  if (!a || !isSelected(kind, id)) return;
  map.setFilter('areas-selected', ['==', ['get', 'id'], id]);
  map.fitBounds(a.bbox, { padding: 40, maxZoom: 16, animate: animate !== false });
  const x = a.extra, m = a.access;
  const cell = (n, share) => `${pct(share)} <span class="sub">${num(n)}</span>`;
  document.getElementById('info').innerHTML = `
    <h3>${esc(a.name || 'Unnamed ' + KIND_LABEL[kind].toLowerCase() + ' #' + a.id)}</h3>
    <div><span class="status">${KIND_LABEL[kind]}</span>
         ${x.kind ? `<span class="sub">${esc(x.kind.replace('_', ' '))}</span>` : ''}
         ${x.name_latin ? `<span class="sub">${esc(x.name_latin)} · №${esc(a.id)}</span>` : ''}</div>
    <dl>
      <dt>Residents</dt><dd>${num(a.population)} <span class="sub">(buildings, 2019)</span></dd>
      ${x.population_nsi != null ? `<dt>NSI</dt><dd>${num(x.population_nsi)} <span class="sub">(control areas, 2017)</span></dd>` : ''}
      <dt>Area</dt><dd>${num(a.area_km2)} km²</dd>
      <dt>Density</dt><dd>${num(a.density)} per km²</dd>
      ${x.district_label ? `<dt>Labelled</dt><dd>${esc(x.district_label)} <span class="sub">(district named in the source)</span></dd>` : ''}
      ${x.boundary_diff_km2 != null ? `<dt>Since 2017</dt><dd>${num(x.boundary_diff_km2)} km² of boundary changed</dd>` : ''}
    </dl>
    <h4>Walk to the metro</h4>
    ${m ? `<table class="access">
      <tr><th></th><th>now</th><th>with planned</th></tr>
      <tr><td>≤ 500 m</td><td>${cell(m.within_500, m.share_500)}</td><td>${cell(m.planned_within_500, m.planned_share_500)}</td></tr>
      <tr><td>≤ 1 km</td><td>${cell(m.within_1000, m.share_1000)}</td><td>${cell(m.planned_within_1000, m.planned_share_1000)}</td></tr>
    </table>
    <div class="sub">Share of residents; straight line to a station, so an upper bound on reach.
      ${a.population < MIN_PEOPLE ? `Few residents: the shares describe single buildings.` : ''}</div>`
      : '<div class="empty">Nobody lives here according to the 2019 building data.</div>'}
    <h4>Walk to a park</h4>
    ${a.park_access ? `<table class="access">
      <tr><th></th><th>entrance</th><th>city park</th></tr>
      <tr><td>≤ 300 m</td><td>${cell(a.park_access.within_300, a.park_access.share_300)}</td><td></td></tr>
      <tr><td>≤ 400 m</td><td>${cell(a.park_access.within_400, a.park_access.share_400)}</td><td></td></tr>
      <tr><td>≤ 800 m</td><td>${cell(a.park_access.within_800, a.park_access.share_800)}</td>
          <td>${cell(a.park_access.city_park_within_800, a.park_access.city_park_share_800)}</td></tr>
    </table>
    <div class="sub">Straight line to an entrance of an existing park (2020).</div>`
      : '<div class="empty">No residents in the 2019 building data.</div>'}
    ${a.park_agreement ? `<div class="sub" style="margin-top:6px">Sofiaplan (2021, 300 m on foot):
      ${pct(a.park_agreement.sofiaplan_share)} of residents with access, we find
      ${pct(a.park_agreement.our_share_300)} for the same ${num(a.park_agreement.buildings)} buildings.</div>` : ''}
    ${a.districts ? `<h4>District${a.districts.length > 1 ? 's' : ''}</h4><ul>` + a.districts.map(d => `<li>
        <a href="#" data-area="district:${esc(d.code)}">${esc(d.name)}</a>
        <span class="sub">${pct(d.share)} of the area · ${num(d.population)} residents${d.main ? ' · main' : ''}</span></li>`).join('') + '</ul>' : ''}
    ${a.issues ? '<h4>Data issues</h4><ul>' + a.issues.map(i => `<li><span>${esc(i.issue)}
        <span class="sub">· ${esc(i.detail)}</span></span></li>`).join('') + '</ul>' : ''}
    <dl>
      <dt>Data as of</dt><dd>${esc(a.data_as_of)}</dd>
      <dt>Source</dt><dd>${esc(a.source)} <span class="sub">${esc(AREA_FILE[kind])}</span></dd>
    </dl>`;
  document.querySelectorAll('#info a[data-area]').forEach(l => l.onclick = e => {
    e.preventDefault(); const [k, i] = l.dataset.area.split(':'); selectArea(k, i);
  });
}

function bounds(geometry) {
  const b = new maplibregl.LngLatBounds();
  const walk = c => typeof c[0] === 'number' ? b.extend(c) : c.forEach(walk);
  walk(geometry.coordinates);
  return b;
}

function selectPark(id, animate) {
  const f = parks.features.find(f => f.properties.id === id); if (!f) return;
  const p = f.properties;
  const gs = gates.features.filter(g => g.properties.park_id === id);
  const count = k => gs.filter(g => g.properties.kind === k).length;
  select('park', id);
  highlight([]);
  // A planned park is drawn only with its toggle on; show it anyway.
  if (p.status === 'planned' && !document.getElementById('show-planned-parks').checked)
    document.getElementById('show-planned-parks').click();
  map.setFilter('parks-selected', ['==', ['get', 'id'], id]);
  map.fitBounds(bounds(f.geometry), { padding: 60, maxZoom: 17, animate: animate !== false });
  document.getElementById('info').innerHTML = `
    <h3>${esc(p.name || 'Unnamed park')}</h3>
    <div><i class="swatch" style="background:${PARK_COLORS[p.kind]}"></i> ${esc(PARK_KIND[p.kind])}
         <span class="status">${esc(p.status)}</span></div>
    <dl>
      <dt>Area</dt><dd>${num(p.area_m2)} m²</dd>
      ${p.tree_cover_pct != null ? `<dt>Trees</dt><dd>${num(p.tree_cover_pct)}% covered by tree massifs</dd>` : ''}
      <dt>Entrances</dt><dd>${gs.length ? `${count('main')} main, ${count('secondary')} secondary,
          ${count('unofficial')} unofficial` : 'none in the data'}</dd>
      ${p.realization != null ? `<dt>Built</dt><dd>realiz = ${esc(p.realization)}
          <span class="sub">(0 none, 1 partly, 2 fully; see DATA_ISSUES #17)</span></dd>` : ''}
      <dt>Data as of</dt><dd>${esc(p.data_as_of)}</dd>
      <dt>Source</dt><dd>${esc(p.source)}</dd>
      <dt>Name from</dt><dd>${esc(p.name_source || '—')}</dd>
    </dl>`;
}

function selectParkEntrance(id, animate) {
  const f = gates.features.find(f => f.id === id); if (!f) return;
  const p = f.properties;
  select('park_entrance', id);
  highlight([f.geometry.coordinates]);
  moveTo(f.geometry.coordinates, 16.5, animate);
  document.getElementById('info').innerHTML = `
    <h3>Park entrance #${esc(p.id)}</h3>
    <div><i class="dot" style="background:${GATE_COLORS[p.kind]}"></i> ${esc(p.kind)}</div>
    <dl>
      <dt>Park</dt><dd>${p.park_id ? `<a href="#" data-park="${esc(p.park_id)}">${esc(p.park_name || 'Unnamed park')}</a>
                        <span class="sub">(${esc(p.park_status)}, ${esc(p.distance_m)} m)</span>`
                      : 'none within 30 m <span class="sub">(see DATA_ISSUES #19)</span>'}</dd>
      <dt>Reached by</dt><dd>${esc(p.note || '—')}</dd>
      <dt>reglament</dt><dd>${esc(p.reglament ?? '—')} <span class="sub">(meaning unknown)</span></dd>
      <dt>Data as of</dt><dd>${esc(p.data_as_of)}</dd>
      <dt>Source</dt><dd>${esc(p.source)}</dd>
    </dl>`;
  const a = document.querySelector('#info a[data-park]');
  if (a) a.onclick = e => { e.preventDefault(); selectPark(a.dataset.park); };
}
</script>
</body>
</html>
