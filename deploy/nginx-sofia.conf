# sofia.novellabs.ai on the Mac mini: nginx terminates HTTPS and passes
# everything to uvicorn (deploy/com.sofia.web.plist). Symlink it into
# /opt/homebrew/etc/nginx/servers/, then `nginx -t && brew services reload nginx`.
#
# The certificate is the one shared with the other sites on the machine;
# its certbot lineage is named before.ws.

server {
    listen 80;
    server_name sofia.novellabs.ai;

    # Let's Encrypt renews over plain HTTP; this must match the webroot
    # in /etc/letsencrypt/renewal/before.ws.conf (not needed if certbot
    # renews with --nginx).
    location /.well-known/acme-challenge/ {
        root /opt/homebrew/var/www;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name sofia.novellabs.ai;

    ssl_certificate     /etc/letsencrypt/live/before.ws/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/before.ws/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The API only takes small JSON bodies; the chat is the exception below.
    client_max_body_size 64k;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:8437;
    }

    # The page sends the whole conversation, tool results included, on
    # every turn. A turn makes up to 16 model calls of up to 180 s each,
    # so allow long pauses between events. The app's X-Accel-Buffering
    # header already stops nginx from buffering the stream.
    location = /api/chat {
        client_max_body_size 5m;
        proxy_read_timeout 600s;
        proxy_pass http://127.0.0.1:8437;
    }
}
